[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "football-player-dna"
version = "0.1.0"
description = "Role-aware football player style similarity engine using event data and interpretable feature engineering."
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "pyarrow>=17",
    "requests>=2.32",
    "matplotlib>=3.9",
    "plotly>=5.24",
    "streamlit",
]

[project.optional-dependencies]
dev = [
    "jupyter>=1.1",
    "pytest>=8.3",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100